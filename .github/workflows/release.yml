name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). Without it npm cannot mint
      # the short-lived publish token and falls back to needing NPM_TOKEN.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json. Setting it
      # here as well makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      # Build first: the react packages resolve the core through its dist/.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify

      # `pnpm pack` is what rewrites the `workspace:^` protocol into a real
      # semver range; plain `npm publish` from the workspace would ship an
      # uninstallable package. Packing first, then publishing the tarball with
      # the npm CLI, gets both the rewrite and npm's OIDC exchange.
      - name: Pack
        run: |
          mkdir -p .artifacts
          for pkg in core react react-native; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.artifacts")
          done
          ls -la .artifacts

      # core first: the UI packages depend on it.
      #
      # Two auth paths, in the npm CLI's own order of preference:
      #   1. OIDC trusted publishing, once each package is linked to this repo
      #      in its npm settings. Nothing to configure here beyond the
      #      id-token permission above, and provenance is automatic.
      #   2. NPM_TOKEN, used only if OIDC is unavailable, which is the case
      #      for a package's very first publish, since a trusted publisher
      #      cannot be attached to a package that does not exist yet.
      # Once 0.1.0 is out and trusted publishing is configured, the secret can
      # be deleted and this keeps working.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The [0-9] guard matters: a bare `react-*` glob also matches
          # `react-native-*`, which would publish the wrong tarball.
          npm publish .artifacts/inicrea-bikram-sambat-core-[0-9]*.tgz --access public --provenance
          npm publish .artifacts/inicrea-bikram-sambat-react-[0-9]*.tgz --access public --provenance
          npm publish .artifacts/inicrea-bikram-sambat-react-native-[0-9]*.tgz --access public --provenance
