name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify

      # core first: the UI packages depend on it.
      - name: Publish
        run: |
          pnpm --filter @inicrea/bikram-sambat-core publish --access public --no-git-checks --provenance
          pnpm --filter @inicrea/bikram-sambat-react publish --access public --no-git-checks --provenance
          pnpm --filter @inicrea/bikram-sambat-react-native publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
